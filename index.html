<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1人回しカード盤</title>
<style>
:root { --bg:#17191e; --panel:#242832; --line:#414754; --text:#f3f4f6; --muted:#b8bfcc; }
* { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-text-size-adjust:100%; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
body { touch-action:pan-x pan-y pinch-zoom; }
header { padding:10px 12px; background:#20232a; border-bottom:1px solid var(--line); }
.board-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.board-heading strong { font-size:15px; font-weight:600; }
.nav-link { color:#dce4ff; text-decoration:none; }
.nav-button { display:inline-flex; align-items:center; justify-content:center; padding:8px 11px; border:1px solid #555d6d; border-radius:8px; background:#303642; color:var(--text); font-size:13px; white-space:nowrap; }
.nav-button:active { background:#454d5c; }
.nav-link-button { display:inline-flex; align-items:center; text-decoration:none; }
h1 { font-size:18px; margin:0; }
.hint { font-size:12px; color:var(--muted); margin-top:7px; line-height:1.5; }
#board { position:relative; width:min(100%, 62vh); max-width:100vw; aspect-ratio:3 / 4; height:auto; min-height:0; max-height:78vh; margin:0 auto; overflow:hidden; background-color:#1b1e24; background-image:radial-gradient(#3b414d 0.7px,transparent 0.7px); background-size:16px 16px; touch-action:pan-x pan-y pinch-zoom; }
.card { width:clamp(50px, 9.9vw, 79px); aspect-ratio:2.5 / 3.5; position:absolute; left:0; top:0; margin:0; border-radius:5px; border:2px solid #596171; background:#111; overflow:hidden; box-shadow:0 3px 8px #0008; user-select:none; touch-action:none; cursor:grab; }
.card img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; background:#111; }
.card.selected { outline:3px solid #80a5ff; outline-offset:1px; }
.card.tapped { transform-origin:center; }
.card.facedown img { display:none; }
.card.facedown { background-image:var(--custom-card-back, radial-gradient(ellipse at center,#364d88 0 13%,transparent 14%),repeating-linear-gradient(45deg,#1c2b50 0 5px,#334b7b 5px 10px)); background-size:cover; background-position:center; border:4px double #c5d2f2; }
.card.facedown::before { content:""; position:absolute; inset:5px; border:1px solid #c5d2f2; border-radius:4px; }
.card.facedown::after { content:""; position:absolute; inset:10px; border:1px solid #91a7db; border-radius:50%; }
.card .tag { position:absolute; left:2px; bottom:2px; max-width:calc(100% - 4px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:1px 3px; border-radius:3px; background:#000b; font-size:9px; pointer-events:none; }
#empty { position:absolute; left:12px; top:12px; right:12px; color:var(--muted); font-size:14px; line-height:1.7; pointer-events:none; }
#empty .start-hint { display:block; margin-top:10px; padding:10px 12px; border:1px solid #555d6d; border-radius:9px; background:#303642; color:var(--text); }
#controls { padding:12px; background:#20232a; border-top:1px solid var(--line); }
.toolbar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.control-footer { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-top:10px; }
.utility-buttons { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:7px; }
button.utility { background:#c87522; border-color:#f0a24d; color:#fff; }
button.utility:active { background:#a85d17; }
button, .file-label { border:1px solid #555d6d; border-radius:8px; padding:9px 11px; background:#303642; color:var(--text); font-size:14px; cursor:pointer; touch-action:manipulation; }
button:active, .file-label:active { background:#454d5c; }
button.primary { background:#3858a8; border-color:#6484d8; }
button:disabled { opacity:.45; cursor:default; }
input[type=file] { display:none; }
#status { color:var(--muted); font-size:12px; margin-top:9px; line-height:1.5; }
@media (min-width:800px) { #board { width:min(100%, 62vh); max-height:78vh; } .card { width:79px; } }
@media (orientation:landscape) and (min-width:600px) {
  html, body { width:100%; height:100%; overflow:hidden; }
  body { height:100dvh; min-height:0; }
  .board-header { position:absolute; top:0; left:0; width:calc(100% - 270px); height:48px; padding:6px 12px; z-index:5; }
  #board { position:absolute; left:0; top:48px; bottom:0; width:auto; height:auto; max-width:none; max-height:none; aspect-ratio:3 / 4; margin:0; }
  #controls { position:absolute; top:0; right:0; bottom:0; width:270px; overflow-y:auto; overscroll-behavior:contain; padding:8px; border-top:0; border-left:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .toolbar { grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
  .control-tile { aspect-ratio:1 / 1; }
  .tile-label { font-size:clamp(6px, 1.1vw, 9px); }
  .control-footer { margin-top:auto; display:flex; flex-direction:column; align-items:stretch; gap:7px; }
  .prob-open { margin:0; width:100%; }
  #status { order:0; }
  .utility-buttons { order:1; width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
  .utility-buttons .control-tile { width:100%; aspect-ratio:1 / 1; }
  #probabilityPanel { position:absolute; left:0; top:48px; bottom:0; width:calc(100% - 270px); overflow:auto; z-index:8; margin:0; }
}



.toolbar { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px 5px; align-items:start; }
.utility-buttons { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; align-items:start; }
.control-tile { min-width:0; width:100%; aspect-ratio:1 / 1; padding:4px; border:1px solid #555d6d; border-radius:9px; background:#303642; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; overflow:hidden; color:var(--text); }
.control-tile:active { background:#454d5c; }
.tile-icon { flex:0 0 auto; width:48%; max-width:29px; aspect-ratio:1 / 1; display:flex; align-items:center; justify-content:center; color:var(--text); }
.tile-icon svg { width:100%; height:100%; }
.tile-label { display:block; width:100%; max-width:100%; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:clip; text-align:center; font-size:clamp(6px, 1.65vw, 10px); line-height:1.2; letter-spacing:-.045em; }
button.control-tile.shuffle-start { background:#258447; border-color:#48b96e; color:#fff; font-weight:600; }
button.control-tile.shuffle-start .tile-label { color:#ffffff; font-weight:600; font-size:clamp(5px, 1.35vw, 8px); }
button.control-tile.utility { background:#c87522; border-color:#f0a24d; color:#fff; }
button.control-tile:disabled { opacity:.45; }
.control-footer { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(54px,.55fr) minmax(0,1.3fr); align-items:center; gap:6px; margin-top:8px; }
.control-footer #openProbability { grid-column:1; }
.control-footer #status { grid-column:2; margin:0; text-align:center; font-size:clamp(8px,2.2vw,12px); line-height:1.4; overflow-wrap:anywhere; }
.control-footer .utility-buttons { grid-column:3; width:100%; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
.control-footer .utility-buttons .control-tile { aspect-ratio:1 / 1; padding:2px; gap:2px; }
.control-footer .utility-buttons .tile-icon { width:40%; max-width:20px; }
.control-footer .utility-buttons .tile-label { font-size:clamp(5px,1.45vw,8px); letter-spacing:-.06em; }
.prob-open { min-width:0; margin:0; padding:8px 4px; font-size:clamp(9px,2.4vw,13px); line-height:1.25; }
#status { min-width:0; }


.prob-open { display:block; width:100%; margin:10px 0 0; padding:12px; background:#303642; border-color:#555d6d; }
.prob-panel { margin:10px 0; padding:14px; background:#20232a; border:1px solid var(--line); border-radius:12px; }
.prob-panel[hidden] { display:none; }
.prob-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.prob-head h2 { margin:0; font-size:18px; }
.prob-note { margin:6px 0 12px; color:var(--muted); font-size:12px; line-height:1.5; }
.prob-close { flex:0 0 auto; font-size:24px; padding:2px 10px; }
.prob-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:14px; }
.prob-field { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; }
.prob-count-control { display:inline-flex; align-items:center; gap:10px; margin-left:4px; }
.prob-count-control button { width:34px; height:34px; padding:0; font-size:21px; line-height:1; border:1px solid #555d6d; border-radius:7px; background:#292e38; color:var(--text); }
.prob-count-control button:disabled { opacity:.35; }
#drawCountValue { min-width:2ch; text-align:center; font-size:16px; font-weight:700; }
.prob-complement { color:#ff7777; font-weight:500; white-space:nowrap; }
.prob-result-row strong { text-align:right; }
.prob-result-values { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; text-align:right; }
.prob-subhead { font-size:13px; font-weight:600; margin:10px 0; }
.prob-card-choices { display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:7px; }
.prob-choice { display:flex; flex-direction:column; align-items:center; gap:4px; border:1px solid #414754; border-radius:8px; padding:6px; background:#292e38; min-width:0; }
.prob-choice.selected { border-color:#80a5ff; background:#303d58; }
.prob-choice img { width:100%; max-width:65px; aspect-ratio:5/7; object-fit:contain; background:#111; border-radius:4px; }
.prob-choice span { font-size:10px; text-align:center; }
.prob-results { margin-top:12px; padding:10px; background:#17191e; border-radius:8px; font-size:13px; line-height:1.7; }
.prob-result-row { display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid #343943; padding:6px 0; }
.prob-result-name { display:flex; align-items:center; gap:7px; min-width:0; }
.prob-result-name img { width:28px; height:40px; object-fit:contain; border-radius:3px; background:#111; flex:0 0 auto; }
.prob-result-name span { overflow-wrap:anywhere; }
.prob-result-row:last-child { border-bottom:0; }
.fixed-order { border:1px solid #414754; border-radius:8px; padding:10px; min-width:0; }
.fixed-order h3 { margin:0 0 8px; font-size:14px; }
.fixed-columns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fixed-columns strong { font-size:11px; }
.fixed-list { display:flex; flex-direction:column; gap:5px; margin-top:7px; }
.fixed-card { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); min-width:0; }
.fixed-card img { width:29px; aspect-ratio:5/7; object-fit:contain; border-radius:3px; background:#111; }
.fixed-unknown { width:29px; aspect-ratio:5/7; display:flex; align-items:center; justify-content:center; border:1px solid #777; border-radius:3px; font-size:14px; }
@media(max-width:650px) { .prob-layout { grid-template-columns:1fr; } .fixed-order { order:2; } .prob-card-choices { grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); } }


@media (orientation:landscape) and (min-width:600px) {
  .board-header { width:calc(100% - 150px); }
  #controls { width:150px; }
  .toolbar { grid-template-columns:1fr; gap:5px; }
  .control-tile { aspect-ratio:auto; min-height:42px; flex-direction:row; justify-content:flex-start; gap:7px; padding:5px 7px; }
  .tile-icon { width:24px; max-width:24px; }
  .tile-label { text-align:left; white-space:normal; overflow-wrap:anywhere; font-size:9px; letter-spacing:-.03em; }
  .control-footer { display:flex; flex-direction:column; align-items:stretch; gap:7px; }
  .control-footer #openProbability { width:100%; font-size:11px; }
  .control-footer #status { text-align:center; font-size:11px; }
  .control-footer .utility-buttons { width:100%; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .control-footer .utility-buttons .control-tile { min-height:44px; aspect-ratio:1 / 1; flex-direction:column; justify-content:center; align-items:center; padding:2px; gap:2px; }
  .control-footer .utility-buttons .tile-icon { width:55%; max-width:20px; }
  .control-footer .utility-buttons .tile-label { text-align:center; white-space:nowrap; font-size:6px; }
  #board { width:min(calc(100vw - 150px), calc((100dvh - 48px) * 0.75)); height:auto; aspect-ratio:3 / 4; max-width:calc(100vw - 150px); bottom:auto; }
  #probabilityPanel { width:calc(100% - 150px); }
}


/* Final layout corrections: the three footer groups stay on one row in portrait. */
.control-footer { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(48px,.6fr) minmax(0,1.25fr); gap:5px; align-items:center; }
.control-footer #openProbability { grid-column:1; margin:0; width:100%; padding:8px 3px; font-size:clamp(9px,2.3vw,13px); }
.control-footer #status { grid-column:2; margin:0; text-align:center; line-height:1.3; font-size:clamp(8px,2vw,12px); }
.control-footer .utility-buttons { grid-column:3; width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; }
.control-footer .utility-buttons .control-tile { width:100%; min-width:0; aspect-ratio:1 / 1; padding:2px; gap:2px; }
.control-footer .utility-buttons .tile-icon { width:42%; max-width:20px; }
.control-footer .utility-buttons .tile-label { font-size:clamp(5px,1.4vw,8px); letter-spacing:-.07em; }
@media (orientation:landscape) and (min-width:600px) {
  .control-footer { display:flex; flex-direction:column; align-items:stretch; gap:7px; margin-top:auto; }
  .control-footer #openProbability { width:100%; margin:0; font-size:11px; }
  .control-footer #status { text-align:center; font-size:11px; }
  .control-footer .utility-buttons { width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
}

</style>
</head>
<body>
<header aria-label="操作エリア" class="board-header">
  <div class="board-heading">
    <strong id="currentDeckName">1人回しカード盤</strong>
    <a class="nav-link nav-button" href="decks.html">デッキ管理</a>
  </div>
</header>
<main id="board">
  <div id="empty">デッキを選択したら、<span class="start-hint">「シャッフルしてひとり回しを始める」を押してください。</span><p>シャッフルせずにドローすると、デッキリストの右下から順にカードを引きます。</p></div>
</main>

<section id="probabilityPanel" class="prob-panel" hidden>
  <div class="prob-head">
    <div>
      <h2>ドロー確率</h2>
      <p class="prob-note">山札から引く確率を計算します。固定順のカードは順番を反映します。</p>
    </div>
    <button id="closeProbability" class="prob-close" type="button" aria-label="確率画面を閉じる">×</button>
  </div>
  <div class="prob-layout">
    <div class="prob-main">
      <div class="prob-field"><span>引く枚数</span>
        <div class="prob-count-control">
          <button id="drawCountMinus" type="button" aria-label="引く枚数を減らす">−</button>
          <span id="drawCountValue" aria-live="polite">1</span>
          <button id="drawCountPlus" type="button" aria-label="引く枚数を増やす">＋</button>
        </div>
      </div>
      <div class="prob-subhead">確率を調べるカード（複数選択可）</div>
      <div id="probCardChoices" class="prob-card-choices"></div>
      <div class="prob-results" id="probResults">デッキを読み込むと、カードごとの確率が表示されます。</div>
    </div>
    <aside class="fixed-order">
      <h3>山札の固定順</h3>
      <div class="fixed-columns">
        <div><strong>山上から</strong><div id="fixedTopList" class="fixed-list"></div></div>
        <div><strong>山下から</strong><div id="fixedBottomList" class="fixed-list"></div></div>
      </div>
    </aside>
  </div>
</section>
<section id="controls">
  <div class="toolbar">
    <input id="images" type="file" accept="image/*" multiple>
    <button id="shuffle" class="control-tile shuffle-start" aria-label="山札シャッフル"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 7h3c5 0 5 10 10 10h4"/><path d="m18 14 3 3-3 3"/><path d="M4 17h3c2 0 3-2 4-4"/><path d="m16 6 5-3"/></g></svg></span><span class="tile-label">山札シャッフル</span></button>
    <button id="draw" class="control-tile " aria-label="ドロー"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></g></svg></span><span class="tile-label">ドロー</span></button>
    <button id="drawDown" class="control-tile " aria-label="裏向きドロー"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m8 8 8 8m0-5v5h-5"/></g></svg></span><span class="tile-label">裏向きドロー</span></button>
    <button id="drawBottom" class="control-tile " aria-label="山下からドロー"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/><path d="M8 5H5v3"/></g></svg></span><span class="tile-label">山下からドロー</span></button>
    <button id="drawBottomDown" class="control-tile " aria-label="山下から裏向きドロー"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m8 8 8 8m0-5v5h-5"/><path d="M8 5H5v3"/></g></svg></span><span class="tile-label">山下から裏向きドロー</span></button>
    <button id="flip" class="control-tile " aria-label="裏返す"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7l8 4 8-4-8-4Z"/><path d="m4 12 8 4 8-4"/><path d="m4 17 8 4 8-4"/></g></svg></span><span class="tile-label">裏返す</span></button>
    <button id="tapToggle" class="control-tile " aria-label="横向き/縦向き"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 12h3m12 0h3"/></g></svg></span><span class="tile-label">横向き/縦向き</span></button>
    <button id="rotate90" class="control-tile " aria-label="90度回転"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0 2 5"/><path d="M20 4v7h-7"/></g></svg></span><span class="tile-label">90度回転</span></button>
    <button id="topDeck" class="control-tile " aria-label="山上へ"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16"/><path d="m8 4 4-3 4 3"/><path d="M12 2v12"/><path d="M5 12v9h14v-9"/></g></svg></span><span class="tile-label">山上へ</span></button>
    <button id="bottomDeck" class="control-tile " aria-label="山下へ"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16h16"/><path d="m8 20 4 3 4-3"/><path d="M12 22V10"/><path d="M5 3v9h14V3"/></g></svg></span><span class="tile-label">山下へ</span></button>
    <button id="shuffleToTop" class="control-tile " aria-label="シャッフルして山上へ"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 7h3c5 0 5 10 10 10h4"/><path d="m18 14 3 3-3 3"/><path d="M4 17h3c2 0 3-2 4-4"/><path d="M12 2v7"/><path d="m9 6 3 3 3-3"/></g></svg></span><span class="tile-label">シャッフルして山上へ</span></button>
    <button id="shuffleToBottom" class="control-tile " aria-label="シャッフルして山下へ"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 7h3c5 0 5 10 10 10h4"/><path d="m18 14 3 3-3 3"/><path d="M4 17h3c2 0 3-2 4-4"/><path d="M12 15v7"/><path d="m9 19 3 3 3-3"/></g></svg></span><span class="tile-label">シャッフルして山下へ</span></button>
  </div>
  <div class="control-footer">
    <button id="openProbability" class="prob-open" type="button">確率計算・山固定</button>
    <div id="status">山札 0枚<br>選択 0枚</div>
    <div class="utility-buttons">
      <button id="undo" class="control-tile utility" aria-label="取り消し"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></g></svg></span><span class="tile-label">取り消し</span></button>
      <button id="redo" class="control-tile utility" aria-label="やり直し" disabled><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h2"/></g></svg></span><span class="tile-label">やり直し</span></button>
      <button id="clear" class="control-tile utility" aria-label="選択解除"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5 5 19"/></g></svg></span><span class="tile-label">選択解除</span></button>
    </div>
  </div>
</section>
<script>

const STORAGE_DB = 'soloCardBoardLocal';
const STORAGE_STORE = 'decks';
function openDeckDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(STORAGE_DB, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORAGE_STORE)) db.createObjectStore(STORAGE_STORE, {keyPath:'id'});
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function getDeck(id) {
  const db = await openDeckDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORAGE_STORE, 'readonly').objectStore(STORAGE_STORE).get(id);
    req.onsuccess = () => { resolve(req.result || null); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
async function getAllDecks() {
  const db = await openDeckDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORAGE_STORE, 'readonly').objectStore(STORAGE_STORE).getAll();
    req.onsuccess = () => { resolve(req.result || []); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
async function putDeck(deck) {
  const db = await openDeckDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORAGE_STORE, 'readwrite').objectStore(STORAGE_STORE).put(deck);
    req.onsuccess = () => { resolve(true); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
async function deleteDeck(id) {
  const db = await openDeckDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORAGE_STORE, 'readwrite').objectStore(STORAGE_STORE).delete(id);
    req.onsuccess = () => { resolve(true); db.close(); };
    req.onerror = () => { reject(req.error); db.close(); };
  });
}
function makeId() {
  return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

(async () => {
  const board = document.getElementById('board');
  const fileInput = document.getElementById('images');
  const status = document.getElementById('status');
  const empty = document.getElementById('empty');
  let cards = [];
  let deck = []; // array start = bottom, array end = top
  // Known deck-list composition. Card positions are not assumed known merely because the list is known.
  let originalCounts = new Map();
  let originalTotal = 0;
  let selected = new Set();
  let nextId = 1;
  let drag = null;
  const undoStack = [];
  const redoStack = [];
  const MAX_UNDO = 50;

  function snapshot() {
    return {
      cards: cards.map(c => ({id:c.id, src:c.src, name:c.name, known:!!c.known, unknown:!!c.unknown, x:c.x, y:c.y, facedown:c.facedown, tapped:c.tapped, rotation:c.rotation || 0})),
      deck: deck.map(d => ({src:d.src, name:d.name, known:!!d.known, fixedTop:!!d.fixedTop, fixedBottom:!!d.fixedBottom, fixedUnknownOrder:!!d.fixedUnknownOrder})),
      nextId
    };
  }
  function saveUndo(state = snapshot()) {
    undoStack.push(state);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack.length = 0;
    updateHistoryButtons();
  }
  function updateHistoryButtons() {
    document.getElementById('undo').disabled = undoStack.length === 0;
    document.getElementById('redo').disabled = redoStack.length === 0;
  }
  function restoreSnapshot(state) {
    cards.forEach(c => c.el?.remove());
    cards=[]; selected.clear();
    deck=state.deck.map(d => ({known:false, fixedTop:false, fixedBottom:false, ...d}));
    nextId=state.nextId;
    state.cards.forEach(data => { const card={...data,el:null}; mountCard(card); cards.push(card); });
    updateSelected(); updateStatus(); refreshProbabilityUI(); updateHistoryButtons();
  }
  function updateStatus() {
    status.textContent = `山札 ${deck.length}枚 / 選択 ${selected.size}枚`;
    empty.style.display = cards.length ? 'none' : 'block';
    updateHistoryButtons();
  }
  function updateSelected() {
    cards.forEach(c => {
      c.el.classList.toggle('selected', selected.has(c.id));
      c.el.style.zIndex = selected.has(c.id) ? '10' : String(c.z || 1);
    });
    updateStatus();
  }
  function applyVisual(card) {
    card.el.classList.toggle('facedown', card.facedown);
    card.el.classList.toggle('tapped', card.tapped);
    card.el.classList.toggle('selected', selected.has(card.id));
    // Rotation must be applied inline; the previous version updated rotation data
    // but did not actually apply it to the card element.
    card.el.style.transform = `rotate(${Number(card.rotation || 0)}deg)`;
    card.el.style.transformOrigin = 'center center';
    card.el.style.zIndex = selected.has(card.id) ? '10' : String(card.z || 1);
  }
  function mountCard(card) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.left = card.x + 'px';
    el.style.top = card.y + 'px';
    const img = document.createElement('img');
    img.src = card.src;
    img.alt = card.name;
    el.appendChild(img);
    el.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      const wasSelected = selected.has(card.id);
      if (!wasSelected) selected.add(card.id);
      updateSelected();
      // Raise the dragged card visually while preserving the selection group.
      card.z = Math.max(1, ...cards.map(c => c.z || 1)) + 1;
      el.style.zIndex = String(card.z);
      board.appendChild(el);
      const moveIds = selected.has(card.id) ? [...selected] : [card.id];
      drag = {
        card, wasSelected, moveIds, startX:e.clientX, startY:e.clientY,
        moved:false, pointerId:e.pointerId, before:snapshot(),
        positions: cards.filter(c => moveIds.includes(c.id)).map(c => ({id:c.id,x:c.x,y:c.y}))
      };
      try { el.setPointerCapture(e.pointerId); } catch {}
    });
    el.addEventListener('pointermove', e => {
      if (!drag || drag.card !== card || drag.pointerId !== e.pointerId) return;
      const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
      if (drag.moved) {
        drag.positions.forEach(pos => {
          const target = cards.find(c => c.id === pos.id);
          if (!target) return;
          const cardWidth = target.el.offsetWidth;
          const cardHeight = target.el.offsetHeight;
          const maxX = Math.max(0, board.clientWidth - cardWidth);
          const maxY = Math.max(0, board.clientHeight - cardHeight);
          target.x = Math.max(0, Math.min(maxX, pos.x + dx));
          target.y = Math.max(0, Math.min(maxY, pos.y + dy));
          target.el.style.left = target.x + 'px';
          target.el.style.top = target.y + 'px';
        });
      }
    });
    el.addEventListener('pointerup', e => {
      if (drag && drag.card === card && drag.pointerId === e.pointerId) {
        if (drag.moved) {
          saveUndo(drag.before);
        } else if (drag.wasSelected) {
          selected.delete(card.id);
          updateSelected();
        }
        drag = null;
        updateStatus();
      }
    });
    el.addEventListener('pointercancel', () => { drag = null; });
    card.el = el;
    applyVisual(card);
    board.appendChild(el);
  }
  function makeCard(src, name, x, y, facedown=false) {
    const card = {id:nextId++, src, name, x, y, facedown, tapped:false, rotation:0, z:cards.length+1, el:null};
    mountCard(card);
    cards.push(card);
    updateStatus();
    return card;
  }
  function removeCard(card) {
    card.el?.remove();
    cards = cards.filter(c => c.id !== card.id);
    selected.delete(card.id);
  }
  function selectedCards() { return cards.filter(c => selected.has(c.id)); }
  function shuffleDeck() {
    for (let i=deck.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]]=[deck[j],deck[i]];
    }
    deck.forEach(item => { item.fixedTop=false; item.fixedBottom=false; item.fixedUnknownOrder=false; });
    updateStatus();
    if (typeof refreshProbabilityUI === 'function') refreshProbabilityUI();
  }
  const shuffleButton = document.getElementById('shuffle');
  function setNormalShuffleButton() {
    shuffleButton.querySelector('.tile-label').textContent = '山札シャッフル';
    shuffleButton.classList.remove('shuffle-start');
  }
  function setStartShuffleButton() {
    shuffleButton.querySelector('.tile-label').textContent = 'シャッフルしてひとり回しを始める';
    shuffleButton.classList.add('shuffle-start');
  }
  function shuffleSelectedIntoDeck(toTop) {
    const chosen = selectedCards();
    if (!chosen.length) {
      alert('山札に戻すカードを1枚以上選択してね。');
      return;
    }
    saveUndo();
    const group = chosen.map(c => ({src:c.src, name:c.name, known:!c.unknown && !!c.known, fixedTop:!!toTop, fixedBottom:!toTop, fixedUnknownOrder:true}));
    for (let i = group.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [group[i], group[j]] = [group[j], group[i]];
    }
    if (toTop) {
      // Deck array end is the top; the shuffled group occupies the topmost positions.
      deck.forEach(item => { item.fixedTop=false; });
      group.forEach(item => deck.push(item));
    } else {
      // Deck array start is the bottom.
      deck.forEach(item => { item.fixedBottom=false; });
      group.forEach(item => deck.unshift(item));
    }
    chosen.forEach(removeCard);
    selected.clear();
    updateSelected();
    updateStatus();
  }

  const probPanel = document.getElementById('probabilityPanel');
  const probChoices = document.getElementById('probCardChoices');
  const probResults = document.getElementById('probResults');
  const fixedTopList = document.getElementById('fixedTopList');
  const fixedBottomList = document.getElementById('fixedBottomList');
  const chosenProbabilityCards = new Set();


  function cardKey(card) { return card && card.src ? card.src : '__unknown__'; }
  function fixedTopCount() {
    let count = 0;
    for (let i=deck.length-1; i>=0 && deck[i].fixedTop; i--) count++;
    return count;
  }
  function fixedBottomCount() {
    let count = 0;
    for (let i=0; i<deck.length && deck[i].fixedBottom; i++) count++;
    return count;
  }
  function fmtPercent(p) { return (Math.max(0,Math.min(1,p))*100).toLocaleString('ja-JP',{maximumFractionDigits:2}) + '%'; }
  function choose(n,k) {
    if (k<0 || k>n || n<0) return 0;
    if (k===0) return 1;
    k=Math.min(k,n-k);
    let out=1;
    for(let i=1;i<=k;i++) out=out*(n-k+i)/i;
    return out;
  }
  function hypergeomAtLeastOne(pop, hit, draws) {
    return hypergeomAtLeastK(pop, hit, draws, 1);
  }
  function hypergeomAtLeastK(pop, hit, draws, minimum) {
    if (minimum <= 0) return 1;
    if (draws <= 0 || hit <= 0 || pop <= 0 || minimum > draws) return 0;
    pop = Math.floor(pop); hit = Math.max(0, Math.min(Math.floor(hit), pop));
    draws = Math.min(Math.floor(draws), pop);
    let probability = 0;
    const low = Math.max(minimum, draws - (pop - hit));
    const high = Math.min(draws, hit);
    const denominator = choose(pop, draws);
    if (!denominator) return 0;
    for (let k = low; k <= high; k++) probability += choose(hit, k) * choose(pop-hit, draws-k) / denominator;
    return Math.max(0, Math.min(1, probability));
  }
  function exactAllSelected(pop, selectedCount, draws) {
    if (draws===0) return 1;
    if (selectedCount < draws || pop < draws) return 0;
    return choose(selectedCount,draws)/choose(pop,draws);
  }
  function renderFixedOrder() {
    const topN = fixedTopCount(), bottomN = fixedBottomCount();
    function renderList(el, items, reverse) {
      el.innerHTML = '';
      const seq = reverse ? items.slice().reverse() : items;
      if (!seq.length) { el.innerHTML = '<span class="small">なし</span>'; return; }
      seq.forEach(item => {
        const row = document.createElement('div');
        row.className = 'fixed-card';
        if (item.known && !item.fixedUnknownOrder) {
          const img = document.createElement('img'); img.src = item.src; img.alt=''; row.appendChild(img);
        } else {
          const unknown = document.createElement('span'); unknown.className='fixed-unknown'; unknown.textContent='？'; row.appendChild(unknown);
        }
        el.appendChild(row);
      });
    }
    renderList(fixedTopList, deck.slice(deck.length-topN), true);
    renderList(fixedBottomList, deck.slice(0,bottomN), false);
  }

  function renderProbabilityChoices() {
    const all = new Map();
    // The deck list is known to its owner even when individual card positions are not.
    deck.forEach(item => { if (item.src && !all.has(item.src)) all.set(item.src, item); });
    cards.forEach(item => { if (!item.unknown && item.src && !all.has(item.src)) all.set(item.src, item); });
    probChoices.innerHTML = '';
    if (!all.size) { probChoices.textContent='デッキリストがありません。'; return; }
    all.forEach((item,key) => {
      const b = document.createElement('button');
      b.type='button'; b.className='prob-choice' + (chosenProbabilityCards.has(key) ? ' selected':'');
      const img=document.createElement('img'); img.src=item.src; img.alt='';
      const span=document.createElement('span'); span.textContent=chosenProbabilityCards.has(key)?'選択中':'選択';
      b.append(img,span);
      b.addEventListener('click',()=>{
        if(chosenProbabilityCards.has(key)) chosenProbabilityCards.delete(key); else chosenProbabilityCards.add(key);
        renderProbabilityChoices(); calculateProbability();
      });
      probChoices.appendChild(b);
    });
  }
  // Counts cards that are definitely known to be outside the random, unrevealed pool.
  function knownOutsidePoolCounts() {
    const counts = new Map();
    cards.forEach(c => {
      if (!c.unknown && c.src) counts.set(c.src, (counts.get(c.src)||0)+1);
    });
    deck.forEach(d => {
      if (d.known && d.src && (d.fixedTop || d.fixedBottom)) counts.set(d.src, (counts.get(d.src)||0)+1);
    });
    return counts;
  }
  function hypergeomDistribution(pop, hit, draws) {
    pop=Math.max(0,Math.floor(pop)); hit=Math.max(0,Math.min(pop,Math.floor(hit))); draws=Math.max(0,Math.min(pop,Math.floor(draws)));
    const out=[]; const den=choose(pop,draws);
    if (!den) return [1];
    for(let k=0;k<=draws;k++) out[k]=choose(hit,k)*choose(pop-hit,draws-k)/den;
    return out;
  }
  function convolve(a,b) {
    const out=Array(a.length+b.length-1).fill(0);
    a.forEach((v,i)=>b.forEach((w,j)=>out[i+j]+=v*w));
    return out;
  }
  function calculateProbability() {
    const requested=Math.max(1,Number(document.getElementById('drawCountValue').textContent)||1);
    const deckSize=deck.length;
    if(!deckSize){probResults.textContent='山札がありません。';return;}
    const selectedKeys=[...chosenProbabilityCards];
    const topN=fixedTopCount(), bottomN=fixedBottomCount();
    const top=deck.slice(deckSize-topN), bottom=deck.slice(0,bottomN), middle=deck.slice(bottomN,deckSize-topN);
    const draws=Math.min(requested,deckSize);
    const topDraws=Math.min(draws,topN);
    const middleDraws=Math.min(Math.max(0,draws-topDraws),middle.length);
    const bottomDraws=Math.max(0,draws-topDraws-middleDraws);
    const hiddenOnBoard=cards.filter(c=>c.unknown).length;
    const knownOut=knownOutsidePoolCounts();
    const randomCounts=new Map();
    originalCounts.forEach((total,key)=>{
      const fixedCount=top.concat(bottom).filter(d=>d.src===key && d.known && !d.fixedUnknownOrder).length;
      const outside=(knownOut.get(key)||0)+fixedCount;
      randomCounts.set(key,Math.max(0,total-outside));
    });
    // Unknown face-down cards are not inspected. The random pool includes the remaining middle
    // and hidden cards on the board; shuffled top/bottom groups retain their composition but not order.
    const effectivePool=Math.max(middle.length+hiddenOnBoard,
      originalTotal-[...knownOut.values()].reduce((a,b)=>a+b,0)-topN-bottomN);
    const regionDistribution=(items,count,selectedPredicate)=>{
      if(count<=0)return [1];
      const selectedCount=items.filter(selectedPredicate).length;
      return hypergeomDistribution(items.length,selectedCount,count);
    };
    const midCountsForKeys=keys=>keys.reduce((sum,key)=>sum+(randomCounts.get(key)||0),0);
    const selectedCountInGroup=(items,keys)=>items.filter(d=>d.src && keys.includes(d.src)).length;
    let rows='';
    selectedKeys.forEach(key=>{
      const sample=allCardSample(key);
      const knownFixedHit=top.slice(top.length-topDraws).some(d=>d.known&&!d.fixedUnknownOrder&&d.src===key) || bottom.slice(0,bottomDraws).some(d=>d.known&&!d.fixedUnknownOrder&&d.src===key);
      let p=knownFixedHit?1:0;
      if(!p){
        const hit=randomCounts.get(key)||0;
        const d=hypergeomAtLeastOne(effectivePool,hit,middleDraws);
        const topHit=selectedCountInGroup(top,key===null?[]:[key]);
        const bottomHit=selectedCountInGroup(bottom,key===null?[]:[key]);
        const topDist=hypergeomDistribution(topN,topHit,topDraws), midDist=hypergeomDistribution(effectivePool,hit,middleDraws), botDist=hypergeomDistribution(bottomN,bottomHit,bottomDraws);
        const dist=convolve(convolve(topDist,midDist),botDist);
        p=1-(dist[0]||0);
        if(topN===0 && bottomN===0) p=d;
      }
      const img=sample?`<img src="${sample.src}" alt="">`:'';
      rows+=`<div class="prob-result-row"><div class="prob-result-name">${img}<span>このカード（デッキ採用 ${originalCounts.get(key)||0}枚）</span></div><strong>${fmtPercent(p)}</strong></div>`;
    });
    if(selectedKeys.length){
      const topSelected=selectedCountInGroup(top,selectedKeys), bottomSelected=selectedCountInGroup(bottom,selectedKeys), middleSelected=midCountsForKeys(selectedKeys);
      const topDist=hypergeomDistribution(topN,topSelected,topDraws);
      const midDist=hypergeomDistribution(effectivePool,middleSelected,middleDraws);
      const botDist=hypergeomDistribution(bottomN,bottomSelected,bottomDraws);
      const dist=convolve(convolve(topDist,midDist),botDist);
      for(let minimum=1;minimum<=draws;minimum++){
        const probability=dist.reduce((sum,v,k)=>sum+(k>=minimum?v:0),0);
        rows+=`<div class="prob-result-row"><span>選択カードを${minimum}枚以上引く</span><div class="prob-result-values"><strong>${fmtPercent(probability)}</strong><span class="prob-complement">(${fmtPercent(1-probability)})</span></div></div>`;
      }
      const allP=draws===0?1:(draws<=topN+bottomN ? 0 : 0);
      // Exact probability that every drawn card is selected, computed region by region.
      const topAll=topSelected>=topDraws && topN>=topDraws ? choose(topSelected,topDraws)/Math.max(1,choose(topN,topDraws)):0;
      const midAll=middleDraws===0?1:(middleSelected>=middleDraws?choose(middleSelected,middleDraws)/Math.max(1,choose(effectivePool,middleDraws)):0);
      const botAll=bottomDraws===0?1:(bottomSelected>=bottomDraws?choose(bottomSelected,bottomDraws)/Math.max(1,choose(bottomN,bottomDraws)):0);
      const allProbability=topAll*midAll*botAll;
      rows+=`<div class="prob-result-row"><span>引いたカードがすべて選択カード</span><div class="prob-result-values"><strong>${fmtPercent(allProbability)}</strong><span class="prob-complement">(${fmtPercent(1-allProbability)})</span></div></div>`;
    } else rows='<div>カードを選択すると確率を表示します。</div>';
    rows+=`<div class="small">計算対象：山札 ${deckSize}枚 / ドロー ${draws}枚。場の裏向きカード ${hiddenOnBoard}枚は正体を参照せず、未知のカードとして計算します。シャッフルして山上・山下へ戻したカードは、内訳を保ちつつ順番を未確定として扱います。</div>`;
    probResults.innerHTML=rows;
  }
  function allCardSample(key) {
    return deck.find(x=>x.src===key) || cards.find(x=>x.src===key) || null;
  }
  function refreshProbabilityUI() {
    renderFixedOrder(); renderProbabilityChoices(); calculateProbability();
  }
  document.getElementById('openProbability').addEventListener('click',()=>{
    probPanel.hidden=false; refreshProbabilityUI(); probPanel.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  document.getElementById('closeProbability').addEventListener('click',()=>{probPanel.hidden=true;});
  let assumedDrawCount = 1;
  function updateDrawCountControl() {
    document.getElementById('drawCountValue').textContent = String(assumedDrawCount);
    document.getElementById('drawCountMinus').disabled = assumedDrawCount <= 1;
    document.getElementById('drawCountPlus').disabled = assumedDrawCount >= 40;
    calculateProbability();
  }
  document.getElementById('drawCountMinus').addEventListener('click', () => { assumedDrawCount = Math.max(1, assumedDrawCount-1); updateDrawCountControl(); });
  document.getElementById('drawCountPlus').addEventListener('click', () => { assumedDrawCount = Math.min(40, assumedDrawCount+1); updateDrawCountControl(); });

  function drawOne(faceDown, fromBottom=false) {
    if (!deck.length) { alert('山札がありません。画像を追加して山札を作ってください。'); return; }
    const data = fromBottom ? deck.shift() : deck.pop();
    const card = {id:nextId++, src:data.src, name:data.name, known:!faceDown && (!!data.known || !data.known), unknown:!!faceDown, x:12+(cards.length%6)*65, y:12+(Math.floor(cards.length/6)%5)*84, facedown:!!faceDown, tapped:false, rotation:0, z:cards.length+1, el:null};
    card.x = Math.max(0, Math.min(card.x, board.clientWidth - 50));
    card.y = Math.max(0, Math.min(card.y, board.clientHeight - Math.min(84, board.clientHeight)));
    mountCard(card);
    card.y = Math.max(0, Math.min(card.y, board.clientHeight - card.el.offsetHeight));
    card.el.style.top = card.y + 'px';
    cards.push(card);
    selected.clear();
    selected.add(card.id);
    updateSelected();
    updateStatus();
    refreshProbabilityUI();
  }
  // Decks are created and saved on the separate deck-management page.
  fileInput.addEventListener('change', () => {
    alert('デッキ管理ページからデッキを登録してください。');
    fileInput.value = '';
  });
  document.getElementById('draw').onclick = () => { if (deck.length) saveUndo(); drawOne(false, false); };
  document.getElementById('drawDown').onclick = () => { if (deck.length) saveUndo(); drawOne(true, false); };
  document.getElementById('drawBottom').onclick = () => { if (deck.length) saveUndo(); drawOne(false, true); };
  document.getElementById('drawBottomDown').onclick = () => { if (deck.length) saveUndo(); drawOne(true, true); };
  document.getElementById('shuffle').onclick = () => { if (deck.length > 1) saveUndo(); shuffleDeck(); setNormalShuffleButton(); };
  document.getElementById('flip').onclick = () => {
    const chosen=selectedCards(); if (!chosen.length) return; saveUndo();
    chosen.forEach(c => { c.facedown=!c.facedown; if (!c.facedown) c.unknown=false; applyVisual(c); });
    refreshProbabilityUI();
  };
  document.getElementById('tapToggle').onclick = () => {
    const chosen=selectedCards(); if (!chosen.length) return; saveUndo();
    // If any selected card is vertical, make all selected cards horizontal.
    // If all are already horizontal, make all selected cards vertical.
    const makeHorizontal = chosen.some(c => (Number(c.rotation || 0) % 180) === 0);
    chosen.forEach(c => {
      c.rotation = makeHorizontal ? 90 : 0;
      c.tapped = makeHorizontal;
      applyVisual(c);
    });
  };
  document.getElementById('rotate90').onclick = () => {
    const chosen=selectedCards(); if (!chosen.length) return; saveUndo();
    chosen.forEach(c => {
      c.rotation=((c.rotation || 0) + 90) % 360;
      const maxX = Math.max(0, board.clientWidth - c.el.offsetWidth);
      const maxY = Math.max(0, board.clientHeight - c.el.offsetHeight);
      c.x = Math.max(0, Math.min(maxX, c.x));
      c.y = Math.max(0, Math.min(maxY, c.y));
      c.el.style.left = c.x + 'px';
      c.el.style.top = c.y + 'px';
      applyVisual(c);
    });
  };
  document.getElementById('topDeck').onclick = () => {
    const chosen=selectedCards(); if (chosen.length !== 1) { alert('山札の上へ送るカードを1枚だけ選択してね。'); return; }
    saveUndo();
    const c=chosen[0]; deck.push({src:c.unknown ? null : c.src,name:c.unknown ? null : c.name,known:!c.unknown && !!c.known,fixedTop:true,fixedBottom:false,fixedUnknownOrder:false}); removeCard(c); selected.clear(); updateStatus(); refreshProbabilityUI();
  };
  document.getElementById('bottomDeck').onclick = () => {
    const chosen=selectedCards(); if (chosen.length !== 1) { alert('山下へ送るカードを1枚だけ選択してね。'); return; }
    saveUndo();
    const c=chosen[0]; deck.unshift({src:c.unknown ? null : c.src,name:c.unknown ? null : c.name,known:!c.unknown && !!c.known,fixedBottom:true,fixedTop:false,fixedUnknownOrder:false}); removeCard(c); selected.clear(); updateStatus(); refreshProbabilityUI();
  };
  document.getElementById('shuffleToTop').onclick = () => shuffleSelectedIntoDeck(true);
  document.getElementById('shuffleToBottom').onclick = () => shuffleSelectedIntoDeck(false);
  document.getElementById('undo').onclick = () => {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    const state=undoStack.pop();
    restoreSnapshot(state);
  };
  document.getElementById('redo').onclick = () => {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    const state=redoStack.pop();
    restoreSnapshot(state);
  };
  document.getElementById('clear').onclick = () => { selected.clear(); updateSelected(); };
  // Any other button action ends the special "start" state and restores the regular label.
  document.querySelectorAll('button:not(#shuffle)').forEach(button => {
    button.addEventListener('click', () => { setNormalShuffleButton(); queueMicrotask(() => { if (typeof refreshProbabilityUI === 'function') refreshProbabilityUI(); }); });
  });
  // Suppress only double-tap zoom on the board; ordinary pinch zoom remains available.
  let lastTouchEnd = 0;
  board.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300 && e.cancelable) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});

  // Global visual preferences are shared by all decks in this browser.
  try {
    const visualPrefs = JSON.parse(localStorage.getItem('soloCardBoardVisualPrefs') || '{}');
    if (visualPrefs.background) { board.style.backgroundImage = `url("${visualPrefs.background}")`; board.style.backgroundSize = '100% 100%'; board.style.backgroundPosition = 'center'; }
    if (visualPrefs.cardBack) document.documentElement.style.setProperty('--custom-card-back', `url("${visualPrefs.cardBack}")`);
  } catch {}
  const params = new URLSearchParams(location.search);
  const selectedDeckId = params.get('deck');
  if (selectedDeckId) {
    try {
      const savedDeck = await getDeck(selectedDeckId);
      if (savedDeck) {
        document.getElementById('currentDeckName').textContent = savedDeck.name;
        const deckCards = [];
        (savedDeck.cards || []).forEach(item => {
          const count = Math.max(0, Number(item.count) || 0);
          for (let i = 0; i < count; i++) deckCards.push({src:item.src, name:item.name, known:false, fixedTop:false, fixedBottom:false});
        });
        deck = deckCards;
        originalCounts = new Map();
        deckCards.forEach(item => originalCounts.set(item.src, (originalCounts.get(item.src)||0)+1));
        originalTotal = deckCards.length;
        setStartShuffleButton();
        updateStatus();
      } else {
        document.getElementById('empty').textContent = 'デッキが見つかりません。デッキ管理から選び直してください。';
      }
    } catch (err) {
      document.getElementById('empty').textContent = '保存データを読み込めませんでした。デッキ管理から確認してください。';
    }
  } else {
    document.getElementById('empty').innerHTML = 'デッキを選択したら、<span class="start-hint">「シャッフルしてひとり回しを始める」を押してください。</span><p>シャッフルせずにドローすると、デッキリストの右下から順にカードを引きます。</p>';
  }
  updateStatus();
  refreshProbabilityUI();
})();
</script>
</body>
</html>
